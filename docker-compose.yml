services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-knowledge_v3_pass}"
      MYSQL_DATABASE: "knowledge_qa_v3"
      TZ: "Asia/Shanghai"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_v3_data:/var/lib/mysql
      - ./migrations:/migrations:ro
      - ./migrations/docker-init/00_init_v3.sh:/docker-entrypoint-initdb.d/00_init_v3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-knowledge_v3_pass}@tcp(db:3306)/knowledge_qa_v3?charset=utf8mb4&parseTime=true"
      ALLOW_WEB_SETUP: "${ALLOW_WEB_SETUP:-true}"
      AUTO_SEED_DEMO: "${AUTO_SEED_DEMO:-true}"
      CONVERT_ENGINE: "${CONVERT_ENGINE:-native}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_CHAT_MODEL: "${LLM_CHAT_MODEL:-}"
      LLM_EMBED_MODEL: "${LLM_EMBED_MODEL:-}"
      EMBED_BASE_URL: "${EMBED_BASE_URL:-}"
      EMBED_API_KEY: "${EMBED_API_KEY:-}"
      LLM_VLM_MODEL: "${LLM_VLM_MODEL:-}"
      VLM_BASE_URL: "${VLM_BASE_URL:-}"
      VLM_API_KEY: "${VLM_API_KEY:-}"
      RERANK_BASE_URL: "${RERANK_BASE_URL:-}"
      RERANK_API_KEY: "${RERANK_API_KEY:-}"
      RERANK_MODEL: "${RERANK_MODEL:-}"

volumes:
  mysql_v3_data:
